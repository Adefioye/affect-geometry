[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affect-geometry"
version = "0.1.0"
description = "Layerwise affect-geometry experiments on GoEmotions language-model activations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.18",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.1",
  "transformers>=4.51",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["prepare", "extract", "rdm", "embed", "analyze", "plot", "run"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
